packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
