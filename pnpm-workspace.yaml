packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@mdi/font': ^7.4.47
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  '@types/qrcode': ^1.5.6
  qr-scanner: ^1.4.2
  qrcode: ^1.5.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  wrangler: ^4.135.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
